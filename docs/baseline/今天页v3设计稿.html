<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>今天页 v3 设计稿（当前数据状态）</title>
<style>
  /* 画板 ui-d-today 的调色板与组件值，逐值沿用 */
  :root{
    --paper:#fbf8f2;--frame:#f2eee6;--surface:#fffdf9;--raised:#f7f3ec;--code:#f4efe5;
    --ink:#241f19;--muted:#5f574b;--faint:#8b8273;
    --line:#e4ddcf;--hair:rgba(36,31,25,.09);
    --accent:#b0531f;--accent-text:#8f431a;--sel:rgba(176,83,31,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#2b2620;display:flex;justify-content:center;padding:40px 0;
       font-family:"Inter","SF Pro Text",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .dev{width:1440px;height:900px;border-radius:14px;overflow:hidden;background:var(--frame);
       box-shadow:0 30px 70px rgba(36,31,25,.18),0 0 0 1px rgba(36,31,25,.05);
       display:flex;flex-direction:column;color:var(--ink)}
  .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ic.sm{width:18px;height:18px}.ic.xs{width:14px;height:14px}

  /* 窗口栏 44 */
  .wb{height:44px;display:flex;align-items:center;gap:16px;padding:0 14px;flex:none;border-bottom:1px solid var(--hair)}
  .lights{display:flex;gap:8px;padding:0 6px;flex:none}
  .lights i{width:12px;height:12px;border-radius:999px;background:var(--line)}
  .tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;height:100%}
  .tab{height:32px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:8px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:300px}
  .tab.on{background:var(--surface);box-shadow:0 0 0 1px var(--hair)}
  .wb-end{display:flex;align-items:center;gap:12px;flex:none}
  .hint{height:28px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:8px;background:rgba(36,31,25,.045);font-size:12px;color:var(--faint)}
  .sync{font-size:12px;color:var(--faint)}

  .wbody{flex:1;display:flex;min-height:0}

  /* 轨道 56：三视图钮 + 分隔 + 工作区钮 + 齿轮 */
  .rail{width:56px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
  .rbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#8b8273}
  .rbtn.on{background:var(--sel);color:var(--accent)}
  .rsp{flex:1}
  .rdiv{width:24px;height:1px;background:var(--hair);margin:4px 0}

  /* 队列列 316：页头 + 搜索 + 分组（空态行 / 最近笔记实数据行） */
  .queue{width:316px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;min-width:0;background:var(--paper)}
  .q-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;flex:none}
  .q-title{font-size:14px;font-weight:600}
  .q-title .n{color:var(--faint);font-weight:400;margin-left:6px}
  .qbtn{margin-left:auto;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--faint)}
  .q-search{height:32px;margin:2px 14px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 11px;font-size:12px;color:var(--faint);flex:none}
  .q-scroll{flex:1;overflow:hidden;padding:0 14px 18px}
  .q-group{margin:22px 0 0}
  .q-gh{height:24px;display:flex;align-items:center;gap:8px;padding:0 4px;font-size:12px;color:var(--muted);font-weight:600}
  .q-gh .sp{flex:1}
  .q-gh .n{color:var(--faint);font-weight:400}
  .q-box{background:rgba(36,31,25,.035);border-radius:14px;padding:3px;margin-top:6px}
  .q-row{display:flex;align-items:center;gap:11px;height:48px;padding:0 11px 0 10px;border-radius:8px;min-width:0}
  .q-row .qic{width:20px;height:20px;display:grid;place-items:center;color:#8b8273;flex:none}
  .q-row .qtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .q-row .rt{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .q-row .rm{font-size:12px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 空态行（A4 口径：一句话，muted） */
  .q-empty{padding:10px 12px;font-size:12px;line-height:1.5;color:var(--faint)}

  /* 内容列：v1 空态引导卡（选中任务详情随 D1 到达） */
  .doc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--paper);padding:24px}
  .doc-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--raised);color:var(--faint)}
  .doc-t{margin:0;font-size:17px;font-weight:600}
  .doc-h{margin:0;font-size:12px;line-height:1.6;color:var(--faint);text-align:center;max-width:320px}
  .doc-btn{margin-top:4px;padding:8px 16px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600}

  /* Agent 列 440（C6 占位） */
  .agent{width:440px;flex:none;border-left:1px solid var(--hair);display:flex;flex-direction:column;background:var(--paper)}
  .a-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none;border-bottom:1px solid var(--hair);font-size:13px;font-weight:600}
  .a-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint)}
  .a-body .t{font-size:12px;line-height:1.6;text-align:center;max-width:280px}
  .a-foot{margin:0 16px 16px;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:12px;color:var(--faint)}
  .a-foot .sp{flex:1}
  .a-send{width:24px;height:24px;border-radius:999px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
</style>
</head>
<body>
<div class="dev">
  <div class="wb">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="tabs">
      <div class="tab on">今天</div>
      <svg class="ic"><use href="#i-plus"/></svg>
    </div>
    <div class="wb-end">
      <div class="hint"><svg class="ic xs"><use href="#i-search"/></svg>搜索或命令 <b>⌘K</b></div>
      <div class="sync">已同步</div>
    </div>
  </div>
  <div class="wbody">
    <div class="rail">
      <div class="rbtn on"><svg class="ic"><use href="#i-sun"/></svg></div>
      <div class="rbtn"><svg class="ic"><use href="#i-pen"/></svg></div>
      <div class="rbtn"><svg class="ic"><use href="#i-layers"/></svg></div>
      <div class="rdiv"></div>
      <div class="rbtn"><svg class="ic"><use href="#i-folder"/></svg></div>
      <div class="rbtn"><svg class="ic"><use href="#i-doc"/></svg></div>
      <div class="rbtn"><svg class="ic"><use href="#i-search"/></svg></div>
      <div class="rbtn"><svg class="ic"><use href="#i-puzzle"/></svg></div>
      <div class="rsp"></div>
      <div class="rbtn"><svg class="ic"><use href="#i-gear"/></svg></div>
    </div>
    <div class="queue">
      <div class="q-head">
        <span class="q-title">今天<span class="n">3 篇笔记</span></span>
        <span class="qbtn"><svg class="ic xs"><use href="#i-filter"/></svg></span>
      </div>
      <div class="q-search"><svg class="ic xs"><use href="#i-search"/></svg>筛选队列</div>
      <div class="q-scroll">
        <div class="q-group">
          <div class="q-gh"><i></i>进行中<span class="sp"></span><span class="n">0</span></div>
          <div class="q-box"><div class="q-empty">进行中的任务会出现在这里——先写下第一篇笔记。</div></div>
        </div>
        <div class="q-group">
          <div class="q-gh"><i></i>该用的资产 · 报价前<span class="sp"></span><span class="n">0</span></div>
          <div class="q-box"><div class="q-empty">还没有可用的资产——判断沉淀之后才会出现。</div></div>
        </div>
        <div class="q-group">
          <div class="q-gh"><i></i>待确认<span class="sp"></span><span class="n">0</span></div>
          <div class="q-box"><div class="q-empty">没有等你确认的提议。</div></div>
        </div>
        <div class="q-group">
          <div class="q-gh"><i></i>最近笔记<span class="sp"></span><span class="n">3</span></div>
          <div class="q-box">
            <div class="q-row">
              <span class="qic"><svg class="ic sm"><use href="#i-doc"/></svg></span>
              <span class="qtx"><span class="rt">笔记一</span><span class="rm">笔记 · 刚刚</span></span>
              <svg class="ic xs chev"><use href="#i-chev"/></svg>
            </div>
            <div class="q-row">
              <span class="qic"><svg class="ic sm"><use href="#i-doc"/></svg></span>
              <span class="qtx"><span class="rt">笔记二</span><span class="rm">笔记 · 昨天</span></span>
              <svg class="ic xs chev"><use href="#i-chev"/></svg>
            </div>
            <div class="q-row">
              <span class="qic"><svg class="ic sm"><use href="#i-doc"/></svg></span>
              <span class="qtx"><span class="rt">子笔记</span><span class="rm">笔记 · 3 天前</span></span>
              <svg class="ic xs chev"><use href="#i-chev"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="doc">
      <div class="doc-ic"><svg class="ic"><use href="#i-sun"/></svg></div>
      <p class="doc-t">从左侧选择一件事开始</p>
      <p class="doc-h">队列还是空的——先打开一个文件夹写第一篇笔记；有了任务与资产，这里就是你的工作台。</p>
      <button class="doc-btn">去笔记</button>
    </div>
    <div class="agent">
      <div class="a-head">Agent</div>
      <div class="a-body">
        <svg class="ic"><use href="#i-spark"/></svg>
        <div class="t">Textus AI 接入后，这里是对话与工具调用的常驻面板（C6）。</div>
      </div>
      <div class="a-foot">让它读、找、建草稿，但不能替你确认<span class="sp"></span><span class="a-send">↑</span></div>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
    <g id="i-pen"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></g>
    <g id="i-layers"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></g>
    <g id="i-folder"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></g>
    <g id="i-doc"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
    <g id="i-puzzle"><path d="M4 7h4V5a2 2 0 1 1 4 0v2h4v4h2a2 2 0 1 1 0 4h-2v4H8v-2a2 2 0 1 0-4 0V7z"/></g>
    <g id="i-gear"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0z"/></g>
    <g id="i-filter"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></g>
    <g id="i-chev"><path d="m9 18 6-6-6-6"/></g>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-spark"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></g>
  </defs>
</svg>
</body>
</html>
