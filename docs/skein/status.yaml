  - id: PH14
    title: 手机手势按 iOS 橡皮筋手感：非线性位移 + 阻尼 + 回弹
    workstream: UI
    kind: task
    state: todo
    acceptance: （未填）
    spec: specs/Textus-手机端元素一致性方案.md#11-动效
    estimate: —
    brief:
      problem: 当前手机横滑只用线性阻尼（PAGER_RESIST 0.25）+ CSS 过渡松手回弹，手感生硬。iOS 的橡皮筋是“非线性位移 + 阻尼 + 回弹”：手指移动与控件位移不成正比，越拉越难、松手弹回；用户举例卡片下拉展开用渐近式 maxExpansion*(1-exp(normalized*0.65))。
      expected: 手机手势按 iOS 手感：位移随手指非线性增长并渐近饱和，越界有阻尼，松手按位置/速度回弹；先覆盖今天/文件横滑，再看库面板与卡片下拉；不做线性系数、固定时长的死硬动效。
      standard: 位移曲线单调、连续、有渐近上界；松手回弹无跳变；参数集中可调（阻尼系数 k、上界、回弹弹簧）；reduced motion 收敛；单测曲线 + Android WebView 实滑/录屏；只借交互模型，不照搬 Apple 私有代码。
      not: 不整页重写、不引第三方动效库；不改桌面/平板；**等 1.4.7 合并完成且 PH13（固定顶栏与分段控件）落地后再开工**；不靠逐帧手调系数反复试，先定公式与参数再实现。
      scope: src/phone（usePagerSwipe/pager-model 等已有拖拽）、engine/motion 的 token；手机布局；先横滑，后卡片下拉。
      evidence: 曲线单测（位移/阻力/回弹）；e2e 拖拽读数；Android 模拟器录屏或分帧截图。
