  - 传输预算：协议写 32 MiB，内置引擎单文件峰值可达 128 MiB；归 S5。
  - 瞬时网络错误：S3t3 multi 的一次 E 同步出现 networkError，重跑通过；transport 级重试/退避归 S5。
