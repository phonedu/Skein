  - id: S13
    title: 多后端独立同步状态
    workstream: S
    kind: task
    state: todo
    acceptance: vault 可保存多个 BackendState（connection/prefix/repository_id/base/last/加密）；同一设备只有一个 active；切换只改 active，不清旧 base/last；切回旧后端用自己的 base 增量；同连接不同库仍按 prefix 隔离；加密不一致拒绝。
    spec: specs/单库多后端同步.md
    estimate: 2–3 天
    brief:
      problem: 当前 vault 只有一个 binding、一份 base；切连接会清 base/last 并生成新 repository_id，所以 LAN 与 S3 每切一次都全量对账，无法实现参考软件的‘各后端各记各账’。
      expected: 数据模型拆成 Vault → multiple BackendState + activeBackendId；每个后端保留自己的 connection/prefix/repository_id/base/last；普通切换只换 active；旧后端状态不删；切回旧后端只同步差异；单后端用户的配置与行为不变。
      standard: 不改 /1 协议；复用现有 binding/base 文件结构与加密；状态迁移要兼容已有单后端数据；切换时阻断同步/插件运行；加密不一致拒绝；store 单测覆盖。
      not: 不做首次对账的冲突策略（S14）；不做同步页 UI（S15）；不做一库多入口自动复制/迁移；不做并行写。
      scope: src-tauri/src/sync/store*（Binding/BackendState、save/load/switch）、ipc-sync 类型、store 单测与迁移测试。
      evidence: 多后端状态单测：切 S3 后再切回 LAN 保留两份 base；旧单后端数据迁移；同 prefix 拒绝；加密不一致拒绝；切换时同步中阻断。
