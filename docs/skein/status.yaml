tasks:
  - id: S7
    title: 三种同步方式的互斥规则与切换测试
    workstream: S
    kind: task
    state: doing
    acceptance: 写清一个库多个独立后端、同一设备只有一个 active、插件双开/切换期间阻断的互斥规则；后端两两切换矩阵按裁决 66 与《单库多后端同步》验收；不再要求“切换清 base”。
    spec: specs/同步页面改版.md
    estimate: 3–5 天
    brief:
      problem: WebDAV、S3 和局域网 Hub 原来只是连接列表里的不同 provider；同库切换、回切、共用 prefix、复制库、插件双开缺少成文规则和覆盖测试。裁决 66 已改定“一库多后端、各留 base”，S7 只剩互斥/阻断/矩阵验收，旧的“切换清 base”不再成立。
      expected: 按裁决 66 定下每设备只有一个 active 后端、多个后端各留状态；切换不清旧 base；同 prefix 拒绝；复制库走 fork；插件与内置双开阻断；切换期间阻断并预览；S13/S14 负责状态与首次对账，S7 负责互斥规则和矩阵验收。
      standard: 先写决策/规格再改代码；复用现有 connection/binding/base 模型与 repositoryInUse；不引入新协议；桌面与手机同一规则；矩阵结果留档。
      not: 不重复实现 S13/S14 的多后端状态与首次对账；不要求切换清 base；不做多活动后端并行写；不改协议 v1。
      scope: specs 的规则与矩阵、src-tauri/src/sync 的绑定/切换逻辑、同步页切换入口、store 单测与桌面/手机 e2e。
      evidence: 3×3 场景矩阵结果、切换/回切/复制库 e2e、store 单测与规则评审记录。
